
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #505465;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    
  }
  #product {
    
    display: flex;
    flex-direction: row;
    gap: 10px; 
    flex-wrap: wrap;
  }
  .card {
    background: 
    rgb(126, 126, 126);
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 20px;
    width: 250px;
    text-align: center;
  }
  #product img {
    width: 100%;
    height: 200px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  #product h2 {
    font-size: 18px;
    margin-bottom: 10px;
  }
  #product p {
    font-size: 16px;
    color: rgb(255, 0, 0);
    font-weight: bold;
  }
    </style>
</head>
<body>

    <div id="product"></div>

    <script src="script.js"></script>
</body>
</html>
